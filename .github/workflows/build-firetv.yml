name: AVS Token Runtime - Vega OS Alexa

on:
  workflow_dispatch:
    inputs:
      auth_code:
        description: 'ONE-TIME Amazon authorization code (leave blank to just refresh token)'
        required: false
        type: string

jobs:
  run-avs: 
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set AVS Credentials from Secrets
        run: |
          echo "AVS_CLIENT_ID=${{ secrets.AVS_CLIENT_ID }}" >> $GITHUB_ENV
          echo "AVS_CLIENT_SECRET=${{ secrets.AVS_CLIENT_SECRET }}" >> $GITHUB_ENV
          echo "AVS_REDIRECT_URI=${{ secrets.AVS_REDIRECT_URI }}" >> $GITHUB_ENV

      - name: Exchange Authorization Code (First Time)
        if: ${{ inputs.auth_code != '' }}
        run: |
          python avs_token_runtime.py "${{ inputs.auth_code }}"

      - name: Get Valid Access Token (Refresh if needed)
        if: ${{ inputs.auth_code == '' }}
        run: |
          python avs_token_runtime.py

      - name: Show Token Status
        run: |
          ls -la avs_tokens.json
          cat avs_tokens.json | python -m json.tool

      - name: Upload avs_tokens.json
        uses: actions/upload-artifact@v4
        with:
          name: avs-tokens
          path: avs_tokens.json







